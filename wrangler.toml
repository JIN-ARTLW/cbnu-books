name = "cbnu-books"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 정적 자산(public/)을 Worker 가 직접 서빙. /api/* 외 모든 요청은 여기서 처리.
[assets]
directory = "public"
binding = "ASSETS"

# Rate limiting 바인딩(베타, unsafe). 캐시 미스 시 IP당 120회/60초.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
